<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Open the connection to the backend while the app is still loading -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!-- ── PWA / Add to Home Screen ─────────────────────────────────────── -->
    <!-- iOS "Add to Home Screen" meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spork" />

    <!-- iOS home screen icon (180×180 for iPhone Retina) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Android / Chrome theme colour -->
    <meta name="theme-color" content="#f5f5f4" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- SEO basics -->
    <meta name="description" content="Track meals, build streaks, share with friends." />
    <meta name="application-name" content="Spork" />

    <title>Spork</title>

    <!-- Apply theme BEFORE React mounts — eliminates flash of wrong theme -->
    <script>
      (function() {
        var stored = localStorage.getItem('spork-theme');
        if (stored !== 'light' && stored !== 'dark') stored = null;
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.classList.remove('dark', 'pink');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        var colors = { light: '#f5f5f4', dark: '#151515' };
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', colors[theme]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
